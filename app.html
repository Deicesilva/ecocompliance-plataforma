<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="EcoCompliance — Plataforma de conformidade ambiental com IA">
<title>EcoCompliance — Plataforma</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body,button,input,select,textarea{font-family:'Sora',sans-serif;}
:root{
  --g1:#082416;--g2:#0d3321;--g3:#164d35;--g4:#1e6645;
  --acc:#10b981;--acc2:#34d399;--accl:#d1fae5;
  --warn:#f59e0b;--warnl:#fef3c7;--warndk:#92400e;
  --dang:#ef4444;--dangl:#fee2e2;--dangdk:#991b1b;
  --info:#3b82f6;--infol:#dbeafe;--infodk:#1e40af;
  --bg:#f0f5f2;--card:#fff;--border:#e5e7eb;
  --tx1:#0f1a14;--tx2:#4b5563;--tx3:#9ca3af;
  --mono:'IBM Plex Mono',monospace;
}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);}
.app{display:flex;min-height:100vh;height:100vh;font-size:13px;}
.sidebar{width:220px;min-width:220px;background:var(--g1);display:flex;flex-direction:column;overflow-y:auto;}
.sidebar-brand{padding:20px 16px 12px;border-bottom:1px solid rgba(255,255,255,.07);}
.brand-logo{display:flex;align-items:center;gap:8px;}
.brand-icon{width:28px;height:28px;background:var(--acc);border-radius:7px;display:flex;align-items:center;justify-content:center;}
.brand-icon svg{width:16px;height:16px;fill:white;}
.brand-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:-.3px;}
.brand-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px;}
.sidebar-user{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
.user-chip{display:flex;align-items:center;gap:8px;}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--g3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--acc2);}
.user-info{flex:1;}
.user-name{font-size:11px;font-weight:500;color:#e0faf0;}
.user-role{font-size:10px;color:rgba(255,255,255,.35);}
.role-badge{font-size:9px;background:rgba(16,185,129,.2);color:var(--acc2);padding:2px 6px;border-radius:3px;border:1px solid rgba(16,185,129,.25);}
.nav-section{padding:10px 10px 4px;font-size:9px;font-weight:600;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.8px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:1px 6px;border-radius:7px;cursor:pointer;color:rgba(255,255,255,.55);font-size:12px;font-weight:400;transition:all .15s;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85);}
.nav-item.active{background:var(--g3);color:#fff;font-weight:500;}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--acc);border-radius:0 3px 3px 0;}
.nav-icon{width:15px;height:15px;opacity:.7;flex-shrink:0;}
.nav-item.active .nav-icon{opacity:1;}
.nav-badge{margin-left:auto;background:var(--dang);color:#fff;border-radius:10px;font-size:9px;padding:1px 5px;font-weight:600;}
.nav-badge.warn{background:var(--warn);}
.sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.07);}
.logout-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;color:rgba(255,255,255,.4);font-size:11px;cursor:pointer;border-radius:6px;transition:.15s;}
.logout-btn:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.7);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:12px;height:52px;flex-shrink:0;}
.header-title{font-size:14px;font-weight:600;color:var(--tx1);flex:1;}
.header-sub{font-size:11px;color:var(--tx2);}
.notif-btn{width:32px;height:32px;border-radius:8px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.notif-dot{position:absolute;top:5px;right:5px;width:6px;height:6px;background:var(--dang);border-radius:50%;border:1px solid white;}
.content{flex:1;overflow-y:auto;padding:20px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:14px;}
.card-sm{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:12px;}
.kpi{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:12px 14px;}
.kpi-label{font-size:10px;color:var(--tx3);font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.kpi-val{font-size:22px;font-weight:600;color:var(--tx1);font-family:var(--mono);line-height:1;}
.kpi-trend{font-size:10px;margin-top:4px;}
.kpi-trend.up{color:var(--acc);}
.kpi-trend.down{color:var(--dang);}
.kpi-trend.warn{color:var(--warn);}
.kpi-trend.info{color:var(--info);}
.section-title{font-size:12px;font-weight:600;color:var(--tx1);margin-bottom:10px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:500;}
.badge.green{background:var(--accl);color:#065f46;}
.badge.red{background:var(--dangl);color:var(--dangdk);}
.badge.amber{background:var(--warnl);color:var(--warndk);}
.badge.blue{background:var(--infol);color:var(--infodk);}
.badge.gray{background:#f3f4f6;color:#374151;}
.tag{display:inline-flex;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:500;}
.tag.fed{background:#ede9fe;color:#5b21b6;}
.tag.est{background:var(--infol);color:var(--infodk);}
.tag.mun{background:var(--warnl);color:var(--warndk);}
.row{display:flex;align-items:center;gap:8px;}
.row-space{display:flex;align-items:center;justify-content:space-between;gap:8px;}
table{width:100%;border-collapse:collapse;font-size:11px;}
th{text-align:left;font-size:10px;color:var(--tx3);font-weight:500;padding:0 8px 8px;text-transform:uppercase;letter-spacing:.4px;}
td{padding:8px;border-top:1px solid var(--border);color:var(--tx1);}
tr:hover td{background:#fafafa;}
.progress{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width .3s;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:.15s;font-family:'Sora',sans-serif;}
.btn-primary{background:var(--acc);color:#fff;}
.btn-primary:hover{background:var(--g4);}
.btn-outline{background:transparent;color:var(--tx2);border:1px solid var(--border);}
.btn-outline:hover{background:var(--bg);}
.btn-sm{padding:5px 10px;font-size:11px;}
.input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-family:'Sora',sans-serif;color:var(--tx1);background:var(--card);outline:none;}
.input:focus{border-color:var(--acc);}
.select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-family:'Sora',sans-serif;color:var(--tx1);background:var(--card);outline:none;cursor:pointer;}
.textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-family:'Sora',sans-serif;color:var(--tx1);background:var(--card);outline:none;resize:vertical;min-height:80px;}
.textarea:focus{border-color:var(--acc);}
.form-group{margin-bottom:12px;}
.form-label{font-size:11px;font-weight:500;color:var(--tx2);margin-bottom:5px;display:block;}
.risk-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.alert-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:8px;margin-bottom:8px;}
.alert-item.crit{background:#fef2f2;border:1px solid #fecaca;}
.alert-item.warn{background:#fffbeb;border:1px solid #fde68a;}
.alert-item.info{background:#eff6ff;border:1px solid #bfdbfe;}
.alert-item.ok{background:#f0fdf4;border:1px solid #bbf7d0;}
.alert-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.alert-text .title{font-size:12px;font-weight:600;color:var(--tx1);}
.alert-text .sub{font-size:11px;color:var(--tx2);margin-top:2px;}
.alert-text .time{font-size:10px;color:var(--tx3);margin-top:3px;}
.gauge-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;}
.minuta-output{background:#f8faf9;border:1px solid #d1e7d9;border-radius:8px;padding:14px;font-size:12px;line-height:1.7;color:var(--tx1);white-space:pre-wrap;font-family:var(--mono);max-height:340px;overflow-y:auto;}
.loading-dots::after{content:' .';animation:dots 1.2s infinite;}
@keyframes dots{0%{content:' .'}33%{content:' ..'}66%{content:' ...'}}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;color:var(--tx3);text-align:center;gap:8px;}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:30px;text-align:center;cursor:pointer;transition:.15s;}
.upload-zone:hover{border-color:var(--acc);background:var(--accl);}
.score-ring{display:flex;align-items:center;justify-content:center;}
.login-screen{min-height:100vh;background:linear-gradient(135deg,#082416 0%,#0d3321 50%,#0a1e10 100%);display:flex;align-items:center;justify-content:center;}
.login-card{background:white;border-radius:16px;padding:36px;width:380px;box-shadow:0 25px 60px rgba(0,0,0,.3);}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filter-chip{padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--tx2);transition:.15s;}
.filter-chip.active{background:var(--g2);color:white;border-color:var(--g2);}
.jurisprudencia-item{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:.15s;}
.jurisprudencia-item:hover{border-color:var(--acc);background:#fafffe;}
.prob-bar{height:8px;border-radius:4px;background:#e5e7eb;overflow:hidden;margin-top:6px;}
.prob-fill{height:100%;border-radius:4px;}
.infr-zone{border:2px dashed var(--border);border-radius:10px;padding:40px;text-align:center;cursor:pointer;}
.infr-zone:hover{border-color:var(--acc);}
.chart-placeholder{background:var(--bg);border-radius:8px;height:160px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:11px;}
.bar-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.bar-h .lbl{font-size:11px;color:var(--tx2);width:100px;text-align:right;flex-shrink:0;}
.bar-h .track{flex:1;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;}
.bar-h .fill{height:100%;border-radius:4px;background:var(--acc);}
.bar-h .val{font-size:11px;font-weight:500;color:var(--tx1);width:30px;font-family:var(--mono);}
.demo-banner{background:linear-gradient(90deg,var(--g2),var(--g3));color:#fff;padding:8px 20px;font-size:11px;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08);}
.demo-banner strong{color:var(--acc2);}
.menu-btn{display:none;width:36px;height:36px;border-radius:8px;background:var(--bg);border:1px solid var(--border);align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--g2);color:#fff;padding:12px 18px;border-radius:10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:200;animation:toastIn .3s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.login-back{display:block;text-align:center;margin-top:16px;font-size:12px;color:#6b7280;text-decoration:none;}
.login-back:hover{color:var(--g4);}
.brand-logo{cursor:pointer;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--card);border-radius:12px;width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
.modal-header h3{font-size:14px;font-weight:600;color:var(--tx1);margin:0;}
.modal-close{background:none;border:none;font-size:20px;color:var(--tx3);cursor:pointer;line-height:1;}
.modal-body{padding:18px;overflow-y:auto;font-size:12px;color:var(--tx2);line-height:1.65;}
.modal-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.alert-item.read{opacity:.55;}
.clickable{cursor:pointer;transition:.15s;}
.clickable:hover{filter:brightness(.98);}
.kpi.clickable:hover{border-color:var(--acc);cursor:pointer;}
@media print{
  .sidebar,.header,.demo-banner,.btn{display:none!important;}
  .main,.app,.content{overflow:visible!important;height:auto!important;}
  .minuta-output{max-height:none;border:none;background:#fff;}
}
@media(max-width:900px){
  .menu-btn{display:flex;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .25s ease;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.open{display:block;}
  .grid2,.grid3,.grid4{grid-template-columns:1fr;}
  .login-card{width:calc(100% - 32px);max-width:380px;padding:28px 24px;}
}
</style>
</head>

function showToast(msg){
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

function getUrlParams(){
  const p=new URLSearchParams(window.location.search);
  return{trial:p.get('trial')==='1',view:p.get('view'),login:p.get('login')==='1'};

function ScoreGauge({score}){
  const r=54,cx=68,cy=68,circ=2*Math.PI*r;
  const filled=(score/100)*circ;
  const color=score>=80?'#10b981':score>=60?'#f59e0b':'#ef4444';
  return h('svg',{viewBox:'0 0 136 136',width:136,height:136},
    h('circle',{cx,cy,r,fill:'none',stroke:'#e5e7eb',strokeWidth:10}),
    h('circle',{cx,cy,r,fill:'none',stroke:color,strokeWidth:10,strokeDasharray:`${filled} ${circ}`,strokeLinecap:'round',transform:`rotate(-90 ${cx} ${cy})`,style:{transition:'stroke-dasharray .8s ease'}}),
    h('text',{x:cx,y:cy-6,textAnchor:'middle',fontSize:24,fontWeight:600,fill:'#0f1a14',fontFamily:'IBM Plex Mono'},score+'%'),
    h('text',{x:cx,y:cy+14,textAnchor:'middle',fontSize:10,fill:'#6b7280',fontFamily:'Sora'},'conformidade'),
  );
}

      h('div',{className:'sidebar-footer'},
        h('div',{className:'logout-btn',onClick:onLogout},
          h('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},h('path',{d:'M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9'})),
          'Sair da plataforma'
        )
      )
    ),
    h('div',{className:'main'},
      trial&&h('div',{className:'demo-banner'},'🌿 Modo demonstração — ',h('strong',null,'14 dias grátis'),' · Dados simulados para apresentação'),
      h('div',{className:'header'},
        h('div',{className:'menu-btn',onClick:()=>setMenuOpen(!menuOpen)},
          h('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2},h('path',{d:'M4 6h16M4 12h16M4 18h16'}))
        ),
        h('div',null,h('div',{className:'header-title'},V.label),h('div',{className:'header-sub'},'Empresa: Metalúrgica Brasil Ltda · CNPJ 12.345.678/0001-00')),
        h('div',{className:'row',style:{gap:8}},
          h('div',{className:'notif-btn',onClick:()=>goView('notificacoes')},
            h('svg',{width:15,height:15,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.8},h('path',{d:'M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9'})),
            unread>0&&h('div',{className:'notif-dot'})
          )
        )
      ),
      h('div',{className:'content'},
        h(V.comp,appProps),
        modal&&h(Modal,{title:modal.title,actions:modal.actions,onClose:()=>setModal(null)},modal.body)
      )
    )
  );
}

function Login({onLogin,trial}){
  const [role,setRole]=useState('advogado');
  const [email,setEmail]=useState('joao@ambientaladvocacia.com.br');
  const [pass,setPass]=useState('');
  const handleLogin=()=>{
    onLogin({role,email,trial});
  };
  return h('div',{className:'login-screen'},
    h('div',{className:'login-card'},
      h('div',{style:{textAlign:'center',marginBottom:24}},
        h('div',{style:{width:48,height:48,background:'#10b981',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px',fontSize:22}},'🌿'),
        h('div',{style:{fontSize:20,fontWeight:600,color:'#0f1a14'}},'EcoCompliance'),
        h('div',{style:{fontSize:12,color:'#6b7280',marginTop:4}},trial?'Ative seu trial gratuito de 14 dias':'Plataforma de Conformidade Ambiental')
      ),
      trial&&h('div',{className:'alert-item ok',style:{marginBottom:16}},
        h('div',{className:'alert-icon',style:{background:'#d1fae5'}},'✨'),
        h('div',{className:'alert-text'},h('div',{className:'title'},'Trial Profissional ativo'),h('div',{className:'sub'},'Acesso completo por 14 dias, sem cartão de crédito.'))
      ),
      h('div',{className:'form-group'},h('label',{className:'form-label'},'E-mail'),h('input',{className:'input',type:'email',value:email,onChange:e=>setEmail(e.target.value)})),
      h('div',{className:'form-group'},h('label',{className:'form-label'},'Senha'),h('input',{className:'input',type:'password',placeholder:'••••••••',value:pass,onChange:e=>setPass(e.target.value),onKeyDown:e=>e.key==='Enter'&&handleLogin()})),
      h('div',{className:'form-group'},
        h('label',{className:'form-label'},'Perfil de acesso'),
        h('select',{className:'select',value:role,onChange:e=>setRole(e.target.value)},
          h('option',{value:'advogado'},'Advogado / Escritório'),
          h('option',{value:'empresa'},'Empresa (Usuário)'),
          h('option',{value:'admin'},'Administrador')
        )
      ),
      h('button',{className:'btn btn-primary',style:{width:'100%',padding:'10px',fontSize:13},onClick:handleLogin},trial?'Começar trial gratuito →':'Entrar na plataforma'),
      h('div',{style:{textAlign:'center',marginTop:12,fontSize:11,color:'#9ca3af'}},'Demo — qualquer senha funciona'),
      h('div',{style:{textAlign:'center',marginTop:6,fontSize:10,color:'#d1d5db'}},'Versão 2.1 · Jun/2026'),
      h('a',{href:'index.html',className:'login-back'},'← Voltar ao site')
    )
  );
}

function App(){
  const params=getUrlParams();
  const [user,setUser]=useState(()=>{
    try{const s=localStorage.getItem(AUTH_KEY);return s?JSON.parse(s):null;}catch(e){return null;}
  });
  const login=(data)=>{
    const u={role:data.role,email:data.email,trial:!!data.trial,ts:Date.now()};
    localStorage.setItem(AUTH_KEY,JSON.stringify(u));
    setUser(u);
    window.history.replaceState({},'','app.html');
    if(data.trial)showToast('Trial de 14 dias ativado! Bem-vindo à EcoCompliance.');
    else showToast('Login realizado com sucesso!');
  };
  const logout=()=>{
    localStorage.removeItem(AUTH_KEY);
    window.location.href='app.html?login=1';
  };
  useEffect(()=>{
    if(params.login){
      localStorage.removeItem(AUTH_KEY);
      setUser(null);
      const qs=params.trial?'?trial=1':'';
      window.history.replaceState({},'',`app.html${qs}`);
    }
  },[]);
  return user
    ?h(AppShell,{onLogout:logout,user,trial:user.trial})
    :h(Login,{onLogin:login,trial:params.trial});
}

const root=ReactDOM.createRoot?ReactDOM.createRoot(document.getElementById('root')):null;
if(root)root.render(h(App,null));
else ReactDOM.render(h(App,null),document.getElementById('root'));
</script>
