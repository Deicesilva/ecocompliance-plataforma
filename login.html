<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoCompliance - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:linear-gradient(135deg,#082416 0%,#0d3321 50%,#0a1e10 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:white;border-radius:16px;padding:40px;width:400px;box-shadow:0 25px 60px rgba(0,0,0,.3);text-align:center;}
.logo{width:56px;height:56px;background:linear-gradient(135deg,#10b981,#34d399);border-radius:12px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;}
.logo svg{width:28px;height:28px;fill:white;}
h1{font-size:22px;font-weight:600;color:#0f1a14;margin-bottom:8px;}
p.subtitle{font-size:13px;color:#6b7280;margin-bottom:32px;}
.form-group{margin-bottom:20px;text-align:left;}
label{display:block;font-size:12px;font-weight:500;color:#374151;margin-bottom:6px;}
input{width:100%;padding:12px 14px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:'Sora',sans-serif;transition:.15s;}
input:focus{outline:none;border-color:#10b981;}
button{width:100%;padding:14px;border-radius:10px;font-size:14px;font-weight:600;font-family:'Sora',sans-serif;cursor:pointer;border:none;transition:.15s;margin-top:8px;}
.btn-primary{background:#10b981;color:white;}
.btn-primary:hover{background:#0d3321;}
.links{display:flex;justify-content:space-between;margin-top:20px;font-size:12px;}
.links a{color:#6b7280;text-decoration:none;}
.links a:hover{color:#10b981;}
.alert{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:12px;margin-top:20px;font-size:12px;color:#92400e;}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  </div>
  <h1>EcoCompliance</h1>
  <p class="subtitle">Plataforma de Gestão Ambiental</p>
  
  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="seu@email.com" required>
    </div>
    <div class="form-group">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-primary">Entrar na Plataforma</button>
  </form>
  
  <div class="links">
    <a href="#">Esqueceu a senha?</a>
    <a href="ecocompliance-landing.html">← Voltar</a>
  </div>
  
  <div class="alert" id="alert" style="display:none;">
    ⚠️ Use: admin@ecocompliance.com / admin123
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;
  
  if (email === 'admin@ecocompliance.com' && senha === 'admin123') {
    window.location.href = 'ecocompliance_platform.html';
  } else {
    document.getElementById('alert').style.display = 'block';
  }
});
</script>
</body>
</html>
