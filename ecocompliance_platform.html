
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body,button,input,select,textarea{font-family:'Sora',sans-serif;}
:root{
  --g1:#082416;--g2:#0d3321;--g3:#164d35;--g4:#1e6645;
  --acc:#10b981;--acc2:#34d399;--accl:#d1fae5;
  --warn:#f59e0b;--warnl:#fef3c7;--warndk:#92400e;
  --dang:#ef4444;--dangl:#fee2e2;--dangdk:#991b1b;
  --info:#3b82f6;--infol:#dbeafe;--infodk:#1e40af;
  --bg:#f0f5f2;--card:#fff;--border:#e5e7eb;

  --mono:'IBM Plex Mono',monospace;
}
.app{display:flex;min-height:600px;height:100vh;max-height:800px;font-size:13px;}
.sidebar{width:220px;min-width:220px;background:var(--g1);display:flex;flex-direction:column;overflow-y:auto;}
.sidebar-brand{padding:20px 16px 12px;border-bottom:1px solid rgba(255,255,255,.07);}
.brand-logo{display:flex;align-items:center;gap:8px;}
.brand-icon{width:28px;height:28px;background:var(--acc);border-radius:7px;display:flex;align-items:center;justify-content:center;}
.brand-icon svg{width:16px;height:16px;fill:white;}
.brand-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:-.3px;}
.brand-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px;}
.sidebar-user{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
.user-chip{display:flex;align-items:center;gap:8px;}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--g3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--acc2);}
.user-info{flex:1;}
.user-name{font-size:11px;font-weight:500;color:#e0faf0;}
.user-role{font-size:10px;color:rgba(255,255,255,.35);}
.role-badge{font-size:9px;background:rgba(16,185,129,.2);color:var(--acc2);padding:2px 6px;border-radius:3px;border:1px solid rgba(16,185,129,.25);}
.nav-section{padding:10px 10px 4px;font-size:9px;font-weight:600;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.8px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:1px 6px;border-radius:7px;cursor:pointer;color:rgba(255,255,255,.55);font-size:12px;font-weight:400;transition:all .15s;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85);}
.nav-item.active{background:var(--g3);color:#fff;font-weight:500;}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--acc);border-radius:0 3px 3px 0;}
.nav-icon{width:15px;height:15px;opacity:.7;flex-shrink:0;}
.nav-item.active .nav-icon{opacity:1;}
.nav-badge{margin-left:auto;background:var(--dang);color:#fff;border-radius:10px;font-size:9px;padding:1px 5px;font-weight:600;}
.nav-badge.warn{background:var(--warn);}
.sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.07);}
.logout-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;color:rgba(255,255,255,.4);font-size:11px;cursor:pointer;border-radius:6px;transition:.15s;}
.logout-btn:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.7);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}

.header-title{font-size:14px;font-weight:600;color:var(--tx1);flex:1;}
.header-sub{font-size:11px;color:var(--tx2);}

.content{flex:1;overflow-y:auto;padding:20px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:14px;}
.card-sm{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:12px;}

.kpi-label{font-size:10px;color:var(--tx3);font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.kpi-val{font-size:22px;font-weight:600;color:var(--tx1);font-family:var(--mono);line-height:1;}
.kpi-trend{font-size:10px;margin-top:4px;}
.kpi-trend.up{color:var(--acc);}
.kpi-trend.down{color:var(--dang);}
.kpi-trend.warn{color:var(--warn);}
.section-title{font-size:12px;font-weight:600;color:var(--tx1);margin-bottom:10px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:500;}
.badge.green{background:var(--accl);color:#065f46;}
.badge.red{background:var(--dangl);color:var(--dangdk);}
.badge.amber{background:var(--warnl);color:var(--warndk);}
.badge.blue{background:var(--infol);color:var(--infodk);}
.badge.gray{background:#f3f4f6;color:#374151;}
.tag{display:inline-flex;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:500;}
.tag.fed{background:#ede9fe;color:#5b21b6;}
.tag.est{background:var(--infol);color:var(--infodk);}
.tag.mun{background:var(--warnl);color:var(--warndk);}
.row{display:flex;align-items:center;gap:8px;}
.row-space{display:flex;align-items:center;justify-content:space-between;gap:8px;}
table{width:100%;border-collapse:collapse;font-size:11px;}
th{text-align:left;font-size:10px;color:var(--tx3);font-weight:500;padding:0 8px 8px;text-transform:uppercase;letter-spacing:.4px;}
td{padding:8px;border-top:1px solid var(--border);color:var(--tx1);}
tr:hover td{background:#fafafa;}
.progress{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width .3s;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:.15s;font-family:'Sora',sans-serif;}

.btn-outline{background:transparent;color:var(--tx2);border:1px solid var(--border);}
.btn-outline:hover{background:var(--bg);}
.btn-sm{padding:5px 10px;font-size:11px;}
.input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-family:'Sora',sans-serif;color:var(--tx1);background:var(--card);outline:none;}

.select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-family:'Sora',sans-serif;color:var(--tx1);background:var(--card);outline:none;cursor:pointer;}

.form-group{margin-bottom:12px;}
.form-label{font-size:11px;font-weight:500;color:var(--tx2);margin-bottom:5px;display:block;}
.risk-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.alert-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:8px;margin-bottom:8px;}
.alert-item.crit{background:#fef2f2;border:1px solid #fecaca;}
.alert-item.warn{background:#fffbeb;border:1px solid #fde68a;}
.alert-item.info{background:#eff6ff;border:1px solid #bfdbfe;}
.alert-item.ok{background:#f0fdf4;border:1px solid #bbf7d0;}

.alert-text .sub{font-size:11px;color:var(--tx2);margin-top:2px;}

.gauge-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;}

.loading-dots::after{content:' .';animation:dots 1.2s infinite;}
@keyframes dots{0%{content:' .'}33%{content:' ..'}66%{content:' ...'}}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;color:var(--tx3);text-align:center;gap:8px;}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:30px;text-align:center;cursor:pointer;transition:.15s;}
.upload-zone:hover{border-color:var(--acc);background:var(--accl);}
.score-ring{display:flex;align-items:center;justify-content:center;}
.login-screen{min-height:100vh;background:linear-gradient(135deg,#082416 0%,#0d3321 50%,#0a1e10 100%);display:flex;align-items:center;justify-content:center;}
.login-card{background:white;border-radius:16px;padding:36px;width:380px;box-shadow:0 25px 60px rgba(0,0,0,.3);}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filter-chip{padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--tx2);transition:.15s;}
.filter-chip.active{background:var(--g2);color:white;border-color:var(--g2);}
.jurisprudencia-item{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:.15s;}
.jurisprudencia-item:hover{border-color:var(--acc);background:#fafffe;}
.prob-bar{height:8px;border-radius:4px;background:#e5e7eb;overflow:hidden;margin-top:6px;}
.prob-fill{height:100%;border-radius:4px;}
.infr-zone{border:2px dashed var(--border);border-radius:10px;padding:40px;text-align:center;cursor:pointer;}
.infr-zone:hover{border-color:var(--acc);}
.chart-placeholder{background:var(--bg);border-radius:8px;height:160px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:11px;}
.bar-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.bar-h .lbl{font-size:11px;color:var(--tx2);width:100px;text-align:right;flex-shrink:0;}
.bar-h .track{flex:1;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;}
.bar-h .fill{height:100%;border-radius:4px;background:var(--acc);}
.bar-h .val{font-size:11px;font-weight:500;color:var(--tx1);width:30px;font-family:var(--mono);}

  const r=54,cx=68,cy=68,circ=2*Math.PI*r;
  const filled=(score/100)*circ;
  const color=score>=80?'#10b981':score>=60?'#f59e0b':'#ef4444';

    h('circle',{cx,cy,r,fill:'none',stroke:'#e5e7eb',strokeWidth:10}),
    h('circle',{cx,cy,r,fill:'none',stroke:color,strokeWidth:10,strokeDasharray:`${filled} ${circ}`,strokeLinecap:'round',transform:`rotate(-90 ${cx} ${cy})`,style:{transition:'stroke-dasharray .8s ease'}}),

  );
}
